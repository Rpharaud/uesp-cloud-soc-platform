name: Repository Validation

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  validate-repository:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Run Markdown Lint
        run: markdownlint "**/*.md"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Format Check
        run: terraform fmt -check terraform/

      - name: Terraform Validation
        run: terraform -chdir=terraform validate

      - name: Verify Required Directories
        run: |
          required_dirs=(
            "configs"
            "docs"
            "evidence"
            "scripts"
            "terraform"
          )

          for dir in "${required_dirs[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "[ERROR] Missing required directory: $dir"
              exit 1
            fi
          done

      - name: Verify Required Markdown Files
        run: |
          required_files=(
            "README.md"
            "DESIGN.md"
            "THEORY.md"
            "TESTPLAN.md"
            "RISKS.md"
            "IMPLEMENTATION.md"
            "EVIDENCE.md"
            "DETECTIONS.md"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "[ERROR] Missing required file: $file"
              exit 1
            fi
          done

      - name: Validate Naming Conventions
        run: |
          echo "[INFO] Checking repository naming conventions..."

          invalid_names=$(find . \
            -not -path "./.git/*" \
            -not -path "./node_modules/*" \
            | grep -E '[A-Z ]' \
            | grep -vE '^\./(README|DESIGN|THEORY|TESTPLAN|RISKS|IMPLEMENTATION|EVIDENCE|DETECTIONS)\.md$' \
            || true)

          echo "[DEBUG] Invalid names detected:"
          echo "$invalid_names"

          if [ -n "$invalid_names" ]; then
            echo "[ERROR] Invalid file or directory naming detected."
            exit 1
          fi

          echo "[INFO] Naming convention validation passed."

      - name: Repository Validation Passed
        run: echo "UESP repository structure validation passed."
